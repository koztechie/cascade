<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade — scene 1</title>
<!--
  Сцена 1 (крок 21) — перший кадр відео, вимога кроку 27: «перший кадр = питання».
  Відкрити на весь екран (F11) і знімати ~15 с.
  Палітра дослівно з viewer.html, щоб кадр був частиною візуальної ідентичності
  проєкту, а не чужим слайдом. Жодних зовнішніх ресурсів, шрифтів чи JS.
-->
<style>
  :root{
    --bg:#0e1116;      /* viewer.html --bg     */
    --panel:#161b22;   /* viewer.html --panel  */
    --text:#e6edf3;    /* viewer.html --text   */
    --muted:#8b949e;   /* viewer.html --muted  */
    --accent:#58a6ff;  /* viewer.html accent   */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
  body{
    font:400 clamp(26px,4.2vw,60px)/1.18 ui-sans-serif,system-ui,-apple-system,
          "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{
    position:relative;
    min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;
    gap:.9em;
    padding:8vh 7vw;
  }
  .brand{
    position:absolute;top:6vh;left:7vw;
    font-size:.3em;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);
  }
  .q{
    margin:0;font-weight:600;letter-spacing:-.012em;
    text-wrap:balance;
    font-size:1em;
  }
  .q b{font-weight:600;color:var(--accent)}
  .p{
    margin:0;max-width:44ch;
    font-size:.4em;line-height:1.5;color:var(--muted);
    text-wrap:pretty;
  }
  .rule{
    width:14vw;min-width:90px;height:3px;border:0;
    background:var(--accent);margin:0;
  }
</style>
<main>
  <span class="brand">Cascade</span>
  <p class="q">We are discontinuing <b>PU-1004</b> — what breaks?</p>
  <hr class="rule">
  <p class="p">Know the blast radius before it breaks: one Cypher question
  returns a path through the graph — not a score.</p>
</main>
</html>
