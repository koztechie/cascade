</style>

  elements: [
    ...G.nodes.map(n => ({ data:{ id:n.id, label:n.label, name:n.name, focus:!!n.focus } })),
    ...G.edges.map(e => ({ data:{ id:e.id, source:e.a, target:e.b, rel:e.rel } }))
  ],
  style,
  layout:{ name:'cose', animate:false, idealEdgeLength:55, nodeRepulsion:350000,
           edgeElasticity:90, nestingFactor:5, gravity:0.35, numIter:1500, randomize:true },
  wheelSensitivity:0.25
});

const panel = document.getElementById('panel');
function hidePanel() {
  panel.style.display = 'none';
  cy.elements().removeClass('highlight faded');
}
window.hidePanel = hidePanel;

function focusNode(id) {
  const n = cy.getElementById(id);
  if (n.nonempty()) n.emit('tap');
}
window.focusNode = focusNode;

cy.on('tap', 'node', evt => {
  const node = evt.target;
  cy.elements().addClass('faded');
  const kept = node.union(node.neighborhood());
  kept.removeClass('faded').addClass('highlight');
  document.getElementById('p-title').textContent =
    node.data('label') + ' · ' + node.data('name');
  const links = node.connectedEdges().map(e => {
    const other = e.source().id() === node.id() ? e.target() : e.source();
    const dir = e.source().id() === node.id() ? '→' : '←';
    return '<li onclick="focusNode(' + JSON.stringify(other.id()) + ')">' +
      esc(e.data('rel')) + ' ' + dir + ' ' + esc(other.data('label')) +
      ': ' + esc(other.data('name')) + '</li>';
  }).join('');
  document.getElementById('p-body').innerHTML =
    '<div class="k">' + (node.data('focus') ? 'Focus product — every listed edge leaves from here'
      : 'Connected object') + '</div><ul>' + (links || '<li>no edges</li>') + '</ul>';
  panel.style.display = 'block';
});

cy.on('tap', evt => { if (evt.target === cy) hidePanel(); });
</script>
</body>
</html>
